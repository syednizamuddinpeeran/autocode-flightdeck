<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight deck</title>
    <script>
      // Runs before first paint so there is no theme flash. Stored choice
      // ("light" | "dark") under "flightdeck-theme" wins; anything else follows
      // prefers-color-scheme. Tested in src/themeInit.test.ts.
      (function () {
        var theme = "light";
        var stored = null;
        try {
          stored = localStorage.getItem("flightdeck-theme");
        } catch (e) {
          /* storage unavailable: fall through to the system preference */
        }
        if (stored === "light" || stored === "dark") {
          theme = stored;
        } else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          theme = "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
        // Stored palette id (default has none). Unknown ids match no CSS block,
        // so they look like Default until theme.ts normalises them.
        var palette = null;
        try {
          palette = localStorage.getItem("flightdeck-palette");
        } catch (e) {
          /* storage unavailable: Default palette */
        }
        if (palette && /^[a-z0-9-]+$/.test(palette) && palette !== "default") {
          document.documentElement.setAttribute("data-palette", palette);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
